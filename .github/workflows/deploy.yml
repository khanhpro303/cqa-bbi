name: Deploy to VPS

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/deploy.yml'
      - 'scripts/deploy_vps_images.sh'
      - 'scripts/test_deploy_workflow.py'
      - 'scripts/retain_deploy_backups.py'
      - 'scripts/test_retain_deploy_backups.py'
  workflow_dispatch:

concurrency:
  group: deploy-vps-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: cqa-ci-test
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pcqa-ci-test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Test deployment backup retention
        run: python3 -m unittest discover -s scripts -p test_retain_deploy_backups.py
      - name: Test VPS image deployment script
        run: python3 -m unittest discover -s scripts -p test_deploy_workflow.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      - name: Test backend and MySQL integration
        working-directory: backend
        env:
          MESSENGER_LABELS_TEST_DSN: root:cqa-ci-test@tcp(127.0.0.1:3306)/?parseTime=true
          MESSENGER_JOURNEY_TEST_DSN: root:cqa-ci-test@tcp(127.0.0.1:3306)/?parseTime=true
        run: |
          go test ./...
          go test -race ./messengerlabels
          go vet ./...
          CGO_ENABLED=0 go build -o /tmp/cqa-server .
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm ci
          npx vitest run
          npm run build

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build production images on GitHub Actions
        shell: bash
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          docker build --platform linux/amd64 --build-arg VERSION="$TARGET_SHA" \
            --label "org.opencontainers.image.revision=$TARGET_SHA" \
            --tag "cqa-app:ci-$TARGET_SHA" .
          docker build --platform linux/amd64 --file docker/Dockerfile.nginx \
            --label "org.opencontainers.image.revision=$TARGET_SHA" \
            --tag "cqa-nginx:ci-$TARGET_SHA" .
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$TARGET_SHA" \
            --tag "cqa-personal-zalo-gateway:ci-$TARGET_SHA" personal-zalo-gateway

          bundle_dir="$RUNNER_TEMP/cqa-image-bundle"
          mkdir -p "$bundle_dir"
          docker image save \
            "cqa-app:ci-$TARGET_SHA" \
            "cqa-nginx:ci-$TARGET_SHA" \
            "cqa-personal-zalo-gateway:ci-$TARGET_SHA" |
            gzip -1 > "$bundle_dir/images.tar.gz"
          (
            cd "$bundle_dir"
            sha256sum images.tar.gz > SHA256SUMS
          )

      - name: Stage images and deploy the exact main revision
        shell: bash
        timeout-minutes: 30
        env:
          TARGET_SHA: ${{ github.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          ssh_dir=$(mktemp -d)
          stage=""
          ssh_options=(
            -T
            -l "$VPS_USER"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ConnectTimeout=12
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$ssh_dir/known_hosts"
            -i "$ssh_dir/key"
          )

          cleanup() {
            if [[ "$stage" =~ ^/home/karien/\.cqa-image-stage\.${GITHUB_RUN_ID}\.[A-Za-z0-9]+$ ]]; then
              ssh "${ssh_options[@]}" -- "$VPS_HOST" \
                "set -eu; if test -d '$stage'; then rm -f -- '$stage/images.tar.gz' '$stage/SHA256SUMS'; rmdir -- '$stage'; fi" || true
            fi
            rm -f -- "$ssh_dir/key" "$ssh_dir/known_hosts"
            rmdir -- "$ssh_dir"
          }
          trap cleanup EXIT

          printf '%s\n' "$VPS_KEY" > "$ssh_dir/key"
          ssh-keyscan -T 10 -t ed25519 "$VPS_HOST" > "$ssh_dir/known_hosts" 2>/dev/null
          test "$(wc -l < "$ssh_dir/known_hosts")" -eq 1
          test "$(ssh-keygen -lf "$ssh_dir/known_hosts" | awk '{print $2}')" = \
            'SHA256:RBKTIUlSdGXAXXTXwFfui52CWuYadrjGCgW4eL1aLkg'

          bundle_dir="$RUNNER_TEMP/cqa-image-bundle"
          transfer_bytes=$(stat -c '%s' "$bundle_dir/images.tar.gz")
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          stage=$(ssh "${ssh_options[@]}" -- "$VPS_HOST" "bash -s -- '$GITHUB_RUN_ID' '$transfer_bytes'" <<'STAGE'
          set -eu
          run_id="$1"
          transfer_bytes="$2"
          set -- $(df -B1 /home/karien | awk 'NR==2 {print $2, $4}')
          disk_floor=$(( $1 / 5 ))
          if [ "$disk_floor" -lt 5368709120 ]; then disk_floor=5368709120; fi
          if [ $(( $2 - transfer_bytes )) -lt "$disk_floor" ]; then
            echo 'Capacity blocked: image transfer would consume the disk reserve.' >&2
            exit 1
          fi
          stage=$(mktemp -d "/home/karien/.cqa-image-stage.${run_id}.XXXXXXXX")
          chmod 700 "$stage"
          printf '%s\n' "$stage"
          STAGE
          )
          [[ "$stage" =~ ^/home/karien/\.cqa-image-stage\.${GITHUB_RUN_ID}\.[A-Za-z0-9]+$ ]]

          tar -C "$bundle_dir" -cf - images.tar.gz SHA256SUMS |
            ssh "${ssh_options[@]}" -- "$VPS_HOST" \
              "set -eu; cd '$stage'; tar -xf -; test \"\$(find . -mindepth 1 -maxdepth 1 -type f | wc -l)\" -eq 2; sha256sum --check --strict SHA256SUMS"

          ssh "${ssh_options[@]}" -- "$VPS_HOST" \
            "bash -s -- '$TARGET_SHA' '$GITHUB_RUN_ID' '$stage'" < scripts/deploy_vps_images.sh
