name: Configure Zalo Browser Run

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply settings and recreate the production app
        required: true
        type: boolean
        default: false
      zalo_group_id:
        description: Exact Zalo group ID for pilot scope only
        required: false
        type: string
      scope:
        description: Which linked Zalo groups may be captured
        required: true
        type: choice
        default: pilot
        options:
          - pilot
          - all_linked_groups

permissions:
  contents: read

concurrency:
  group: deploy-vps-main
  cancel-in-progress: false

jobs:
  configure:
    if: github.ref == 'refs/heads/main' && inputs.apply
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify Browser Run configuration and rollback logic
        run: python3 -m unittest discover -s scripts -p test_configure_zalo_browser_run.py
      - name: Apply app-only Browser Run credentials via pinned SSH
        shell: bash
        env:
          TARGET_SHA: ${{ github.sha }}
          ZALO_GROUP_ID: ${{ inputs.zalo_group_id }}
          CAPTURE_SCOPE: ${{ inputs.scope }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          ZALO_ORDER_SCREENSHOT_CF_ACCOUNT_ID: ${{ secrets.ZALO_ORDER_SCREENSHOT_CF_ACCOUNT_ID }}
          ZALO_ORDER_SCREENSHOT_CF_API_TOKEN: ${{ secrets.ZALO_ORDER_SCREENSHOT_CF_API_TOKEN }}
          ZALO_ORDER_SCREENSHOT_PROFILE: ${{ secrets.ZALO_ORDER_SCREENSHOT_PROFILE }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$CAPTURE_SCOPE" in
            pilot) [[ "$ZALO_GROUP_ID" =~ ^[A-Za-z0-9_-]{1,128}$ ]] ;;
            all_linked_groups) [[ -z "$ZALO_GROUP_ID" ]] ;;
            *) exit 1 ;;
          esac
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          : "${VPS_HOST:?VPS_HOST is required}" "${VPS_USER:?VPS_USERNAME is required}" "${VPS_KEY:?VPS_SSH_KEY is required}"
          ssh_dir=$(mktemp -d)
          trap 'rm -f -- "$ssh_dir/key" "$ssh_dir/known_hosts"; rmdir -- "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_KEY" > "$ssh_dir/key"
          printf '%s\n' 'cqa-vps-deployment ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIvNjedlYQMH0CGwjOgJjjR0FA0t0138x7NcjLPih5pI' > "$ssh_dir/known_hosts"
          test "$(ssh-keygen -lf "$ssh_dir/known_hosts" | awk '{print $2}')" = \
            'SHA256:RBKTIUlSdGXAXXTXwFfui52CWuYadrjGCgW4eL1aLkg'
          ssh_options=(
            -T -l "$VPS_USER"
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=12
            -o HostKeyAlias=cqa-vps-deployment -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -i "$ssh_dir/key"
          )
          python3 scripts/configure_zalo_browser_run.py --scope "$CAPTURE_SCOPE" --emit "$ZALO_GROUP_ID" |
            ssh "${ssh_options[@]}" -- "$VPS_HOST" \
              "cd /home/karien/cqa-personal-zalo && exec python3 scripts/configure_zalo_browser_run.py --scope '$CAPTURE_SCOPE' --apply '$TARGET_SHA' '$ZALO_GROUP_ID' '$GITHUB_RUN_ID'"
